[project]
name = "replay-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["courtcam", "replay-api", "replay-worker", "replay-render"]

[tool.uv.workspace]
members = ["courtcam", "services/api", "services/worker", "render"]

[tool.uv.sources]
courtcam = { workspace = true }
replay-api = { workspace = true }
replay-worker = { workspace = true }
replay-render = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]
