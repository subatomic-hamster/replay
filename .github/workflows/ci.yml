# Every command here is also run on the dev box by scripts/box-test.sh (`make test`).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18" # the box's uv; uv.lock was written by it
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check courtcam services render
      - name: courtcam tests
        working-directory: courtcam
        run: uv run pytest -q
      - name: api tests
        working-directory: services/api
        run: uv run pytest -q
      - name: worker tests
        working-directory: services/worker
        run: uv run pytest -q
      - name: render tests
        working-directory: render
        run: uv run pytest -q
      - name: infra/dag.json matches the worker DAG
        run: uv run python -m replay_worker dag | diff - infra/dag.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright's config also starts the API (fake pipeline) through uv.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm exec playwright install --with-deps chromium
      - name: playwright (mock project)
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results

  # apps/tv has its own pnpm workspace, lockfile and react-native-video patch (D-64);
  # the tv project runs the react-native-web build against the shared mock API (no uv/API).
  tv:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm exec playwright install --with-deps chromium
      - name: playwright (tv project)
        run: pnpm exec playwright test --project=tv
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-tv
          path: apps/tv/test-results

  infra:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # env-agnostic stacks: synth needs no AWS credentials
      - run: npx cdk synth --quiet
