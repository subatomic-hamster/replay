[project]
name = "courtcam"
version = "0.1.0"
description = "Sport-profile driven video pipeline: calibrate a court, track players, cut follow-cam crop paths."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Replay" }]
# The core is permissive-only (MIT/BSD/Apache): synth, calibration, the synthetic
# detector, tracks/identity/court/crops from given detections, events, plays, render.
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pyyaml>=6",
    "pydantic>=2",
    "typer>=0.12",
    "tqdm>=4.66",
    # Hungarian assignment for the MOT metrics (D-38); also what ultralytics' trackers
    # would otherwise pip-install mid-run
    "lap>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# `--detector yolo` / `--pose yolo`: ultralytics is AGPL-3.0 (see README "Licence").
# torch is pinned to the CPU wheels below: CI has no GPU (D-5); the box brings ROCm torch.
yolo = ["ultralytics>=8.3", "torch>=2.4", "torchvision>=0.19"]
# `--pose vit`: ViTPose (Apache-2.0 weights) through transformers (D-61)
vitpose = ["transformers>=5", "torch>=2.4"]
# voice triggers: Whisper through transformers (`asr_model`)
asr = ["transformers>=5", "torch>=2.4"]
# `courtcam autocalib --backend vlm`. The `claude-cli` backend needs neither.
vlm = ["anthropic>=0.40"]

[project.scripts]
courtcam = "courtcam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtcam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
