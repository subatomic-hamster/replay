[project]
name = "replay-worker"
version = "0.1.0"
description = "Replay job orchestrator: per-game stage DAG over a content-hash cache"
requires-python = ">=3.12,<3.13"
dependencies = ["courtcam"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replay_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
