id: basketball
display_name: Basketball
tier: 2
court:
  # Plan §4.9 shows a single `template:`; basketball needs one per variant, so the
  # loader accepts `templates: {variant: file}` as well. See README "Profile format".
  templates:
    half: basketball_half.json
    full: basketball_full.json
  variants: [half, full]
  # The templates above are FIBA. US gyms: NBA (16 ft lane, 23.75 ft three), NCAA (12 ft
  # lane, 22.15 ft three) and NFHS high school (12 ft lane, 19.75 ft three, 84 ft long).
  # All US: free-throw line 19 ft from the baseline, rim centre 5.25 ft. `calibrate`
  # fits every standard and keeps the clearly best one unless the user picked one.
  standards:
    nba: { half: basketball_half_nba.json, full: basketball_full_nba.json }
    ncaa: { half: basketball_half_ncaa.json, full: basketball_full_ncaa.json }
    nfhs: { half: basketball_half_nfhs.json, full: basketball_full_nfhs.json }
  landmarks: [corner_nl, corner_nr, corner_fl, corner_fr, rim]
  # Optional extras for clips where a corner is off-frame or occluded (real footage
  # routinely is). Any of these present in a landmarks.json is folded into the
  # homography fit; the uploader still only asks for `landmarks` above.
  landmarks_optional:
    [
      key_nl,
      key_nr,
      ft_nl,
      ft_nr,
      key_fl,
      key_fr,
      ft_fl,
      ft_fr,
      centre_l,
      centre_r,
    ]
  margin_m: 1.0
  # D-23: plain-language glossary handed to the vision model by `courtcam autocalib`.
  # Nothing else reads these; they are prose for a model, not geometry.
  orientation_hint: |-
    Which end of the court is "near" (n) and which is "far" (f):
      - Full court: the NEAR baseline is the end line under whichever basket appears
        further LEFT in the picture, and the FAR baseline is the other end line. If
        both baskets sit at about the same left-right position, the NEAR baseline is
        the one closer to the camera (lower down in the picture).
      - Half court: the NEAR baseline is the painted end line under the basket, and
        the FAR line is the half-way line at the far end of the playing area shown.
    A gym floor usually has several courts painted on it in different colours,
    including small cross-courts that share the same baskets. Use the LARGEST
    one - the court whose two baselines are furthest apart, running the long way
    down the room - and ignore every other set of lines.
    These cameras are wide-angle and often panoramic, so the court fills the frame and
    its lines are curved. An end line is NOT a short vertical line under the basket and
    it is NOT the edge of the coloured out-of-bounds border or the wall behind it: it is
    a painted line that sweeps a long way across the picture, from one sideline to the
    other, and near the corners it may leave the frame. Trace the painted line itself.
    A corner is where two painted lines actually cross, out on the playing surface.
    Which sideline is "l" and which is "r": the sidelines are the two long edges that
    run between the two baselines. The `l` sideline is the one HIGHER in the picture
    (further from the camera); the `r` sideline is the one LOWER in the picture
    (nearer the camera). Use that rule even if it feels backwards — the software
    corrects a whole-court left/right swap on its own, but only if you are consistent.
    The "further LEFT" rule above is not only prose: `templatefit.near_end_is_left`
    applies it mechanically to pick between the two otherwise identical ways of laying
    a 180-degree-symmetric full court onto the same four corners. A court sport is
    filmed from the SIDE, so both ends are the same distance from the camera and which
    one is "near" is pure convention — this is the convention.
  landmark_descriptions:
    corner_nl: the court corner where the NEAR baseline meets the `l` sideline.
    corner_nr: the court corner where the NEAR baseline meets the `r` sideline.
    corner_fl: the court corner where the FAR baseline meets the `l` sideline.
    corner_fr: the court corner where the FAR baseline meets the `r` sideline.
    rim: >-
      the point on the FLOOR directly underneath the centre of the hoop at the NEAR
      basket - the centre of the small semicircular restricted-area arc painted under
      that basket, on the centre line of the key and roughly 1.5 m in front of the
      baseline. This is a point on the floor, NOT the hoop itself (which is 3 m up)
      and NOT the backboard.
    key_nl: >-
      where the `l`-side long edge of the key (the painted rectangle in front of the
      NEAR basket) meets the NEAR baseline.
    key_nr: the same corner of the NEAR key on the `r` side.
    ft_nl: >-
      where the free-throw line at the NEAR basket meets the `l`-side long edge of the
      NEAR key - the far corner of the painted rectangle on the `l` side.
    ft_nr: the same free-throw-line corner of the NEAR key on the `r` side.
    key_fl: where the `l`-side long edge of the FAR key meets the FAR baseline.
    key_fr: the same corner of the FAR key on the `r` side.
    ft_fl: where the free-throw line at the FAR basket meets the `l`-side edge of the FAR key.
    ft_fr: the same free-throw-line corner of the FAR key on the `r` side.
    centre_l: >-
      where the half-way line (the line across the middle of the court through the
      centre circle) meets the `l` sideline.
    centre_r: where the half-way line meets the `r` sideline.
# `max` is a *concurrency* cap — the most players selectable at any one instant, not the
# size of the roster over the clip. Substitutions push the total above it.
players: { min: 2, max: 10 }
team_rule: jersey_color
detection:
  { classes: [person], stride: 2, model: yolo11n.pt, imgsz: 960, conf: 0.25 }
tracking:
  oncourt_min_fraction: 0.6
  min_lifetime_s: 1.0
  # Tuned on samples/real (see samples/real/RESULTS.md). The plan's 1.5 s / 2 m suits a
  # clean overhead shot; in a real gym a player vanishes behind a screen for seconds at
  # a time, and 1.5 s / 2 m left ~3 of 10 players selectable at any moment. 5 s / 7 m
  # ("lost for a possession, reappears within a jog") gets that to ~4.5 with no dead
  # seconds, at the cost of more identity switches — which the tag UI corrects.
  merge_max_gap_s: 5.0
  merge_max_dist_m: 7.0
  # D-89: cut tracklets where the tracker handed the id to someone else, and gate merges
  # and stitches by body appearance. CC BY Nottingham game, 120 random 30 s follows: the
  # ring on another kit 22.2 % -> 16.0 % of the time, on the right kit 59.6 % -> 61.1 %.
  appearance_cut: 0.22
  appearance_weight: 1.0
  appearance_max: 0.18
  # D-89: up to 6 on court at once (pickup, 1v1 to 3v3) is solved as that many people.
  # CC BY 2v2 park clip, 4 people, 120 s vs a hand-checked GT: 21 ids -> 4, the ring on
  # the right person 47 % -> 83 % of a 30 s follow (someone else 29 % -> 17 %).
  roster_max: 6
  # D-97: room for a three-person crew in the concurrency cap (players.max + officials).
  # CC BY Nottingham, hand-labelled players at 14 instants: 72.6 % -> 86.7 % boxed.
  officials: 3
  smooth_window: 5
# Order matters: `possession` reads the shots (rebound vs steal, make vs miss).
events: [shot, possession, lost_man, hype]
# M4 play grammar (courtcam.plays): possession start -> shot or turnover. A steal both
# ends the old possession and starts the new one; a put-back after an offensive rebound
# (a shot while no possession is open) is a one-shot play.
plays:
  - name: possession
    start: [possession_change]
    end: [shot, turnover]
    # any team's shot or turnover is a natural break that ends the open play: event teams
    # can be wrong (half court: both teams shoot at one hoop), and a play that runs on
    # past a basket swallows the next clip (D-50 needs a play ending just before an X)
    orphan_end: [shot] # a lone turnover is no play of its own
    max_s: 40
    roles:
      possession_change.inbound: inbounder
      possession_change.steal: stealer
      possession_change.defensive_rebound: rebounder
      shot: shooter
      turnover: turnover
  # a defender losing their man (events.detect_lost_man) is a play of its own, so the
  # highlights can replay it from the defender's eyes
  - name: lost_man
    start: [lost_man]
    end: [lost_man]
    roles: { lost_man: defender }
shot:
  two_pt_zones: [three_point, three_point_far]
  rim_radius_m: 7.0
  roi_px: 96
  min_gap_s: 2.0
  burst_sigma: 2.5
  pre_s: 3.0
  post_s: 2.0
  # Pose path (samples/real/RESULTS.md "Accuracy pass"): a release counts with the
  # wrists at shoulder height or above (a far player's nose is rarely scored); the hoop
  # pixel comes from the full camera model, not a guessed lift above the rim's floor
  # point; the confirm z-score has a noise floor (a static ROI's MAD is ~0, so any
  # flicker scored z >= 4). Synthetic, ViTPose: 14/27 -> 19/27 shots at precision 1.0.
  release_up_min: -0.2
  # The lower arm line above makes every measured release longer: a synthetic jump shot
  # is 0.83-0.87 s above the nose but 0.90-0.93 s above that line, so the 0.9 s default threw
  # 5 of 23 GT-pose shots out as "held" (18/27 -> 23/27 at P 1.00 with 1.0; YOLO pose
  # unchanged at 21/27; real Kennesaw unchanged, 3 shots, all real).
  release_max_s: 1.0
  hoop_from_camera: true
  confirm_mad_floor: 0.5
  # D-90: on a full court every shot at a basket is one team's (until half time)
  team_by_hoop: true
# D-90: watch the ball around every rim in frame (courtcam.ball); each visit is a shot and
# its path through (or off) the rim is the make/miss. Replaces the pose + rim-burst shots.
ball: { enabled: true }
# What a basket is worth (full-court rules). Pickup half court: e.g. {inside: 1,
# outside: 2, to: 11} or {inside: 2, outside: 3, to: 21}; `to` restarts the score after a win.
scoring: { inside: 2, outside: 3, free_throw: 1 }
# `zoom` divides the court's *pixel* width (calib.court_polygon_px, clipped to the
# frame) to get the follow-cam window, not the frame width — so the same number means
# the same framing on a tight 720p clip and on a 2560x960 whole-court panorama, and the
# window is 16:9 whatever the source is. 2.4 = "a bit over a third of the court across":
# on basketball_kennesawwide_240s.mp4 that is a 1039x584 window and a median on-court
# player 124 px tall, i.e. 1/4.7 of the crop height (samples/real/RESULTS.md). Floor is
# croppath.MIN_CROP_W, cap is the frame width.
followcam: { zoom: 2.4, lead_s: 0.3, stiffness: 7.0 }
query_vocab:
  shots: { type: shot }
  makes: { type: shot, made: true }
  misses: { type: shot, made: false }
sport_ui:
  chips: ["All shots", "Makes", "Misses", "Top plays"]
  review: [shot_chart, heatmap, box_score]
# Synthetic clip choreography (courtcam.synth); nothing in the pipeline reads it.
synth:
  view: sideline
  floor: "#CD9F6E"
  apron: "#7A4A2A"
  ball: { radius_m: 0.12, color: "#E0702A" }
  team_colors: ["#1F4FA0", "#E8E8E8"]
  contact_sound_hz: 160
