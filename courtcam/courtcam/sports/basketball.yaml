id: basketball
display_name: Basketball
tier: 2
court:
  # Plan §4.9 shows a single `template:`; basketball needs one per variant, so the
  # loader accepts `templates: {variant: file}` as well. See README "Profile format".
  templates:
    half: basketball_half.json
    full: basketball_full.json
  variants: [half, full]
  landmarks: [corner_nl, corner_nr, corner_fl, corner_fr, rim]
  # Optional extras for clips where a corner is off-frame or occluded (real footage
  # routinely is). Any of these present in a landmarks.json is folded into the
  # homography fit; the uploader still only asks for `landmarks` above.
  landmarks_optional:
    [key_nl, key_nr, ft_nl, ft_nr, key_fl, key_fr, ft_fl, ft_fr, centre_l, centre_r]
  margin_m: 1.0
players: {min: 2, max: 10}
team_rule: jersey_color
detection: {classes: [person], stride: 2, model: yolo11n.pt, imgsz: 960, conf: 0.25}
tracking:
  oncourt_min_fraction: 0.6
  min_lifetime_s: 1.0
  # Tuned on samples/real (see samples/real/RESULTS.md). The plan's 1.5 s / 2 m suits a
  # clean overhead shot; in a real gym a player vanishes behind a screen for seconds at
  # a time, and 1.5 s / 2 m left ~3 of 10 players selectable at any moment. 5 s / 7 m
  # ("lost for a possession, reappears within a jog") gets that to ~4.5 with no dead
  # seconds, at the cost of more identity switches — which the tag UI corrects.
  merge_max_gap_s: 5.0
  merge_max_dist_m: 7.0
  smooth_window: 5
events: [shot]
shot:
  rim_radius_m: 7.0
  roi_px: 96
  min_gap_s: 2.0
  burst_sigma: 2.5
  pre_s: 3.0
  post_s: 2.0
followcam: {zoom: 2.0, lead_s: 0.3, stiffness: 7.0}
query_vocab:
  shots: {type: shot}
  makes: {type: shot, made: true}
  misses: {type: shot, made: false}
sport_ui:
  chips: ["My shots", "Makes", "Last 2 minutes"]
  review: [shot_chart, heatmap]
