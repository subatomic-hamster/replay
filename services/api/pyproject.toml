[project]
name = "replay-api"
version = "0.1.0"
description = "Replay Phase 1 API (local providers)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "courtcam",
    # D-80 cloud mode: boto3 (S3/SSM; in the Lambda runtime too), mangum (Lambda entry),
    # httpx (the hfbox remote runner)
    "boto3>=1.35",
    "mangum>=0.17",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "moto[server]>=5.0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replay_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
