id: badminton
display_name: Badminton
# Tier 1 only — see the note in pickleball.yaml.
tier: 1
court:
  # One court: virtually every hall is marked for doubles, and the singles sidelines are
  # optional landmarks on that same template. A singles game on it is still just
  # `players.min` 2 (D-21), so a second variant only bought the uploader a picker.
  template: badminton_doubles.json
  variants: [doubles]
  variant_aliases: {singles: doubles}
  landmarks: [corner_nl, corner_nr, corner_fl, corner_fr, net_post_l, net_post_r]
  landmarks_optional:
    [short_nl, short_nr, short_fl, short_fr, long_nl, long_nr, long_fl, long_fr,
     centre_n, centre_sn, centre_sf, centre_f,
     singles_nl, singles_nr, singles_fl, singles_fr]
  # D-23: prose for the vision model used by `courtcam autocalib`, not geometry.
  orientation_hint: |-
    A badminton court is a rectangle split in half by a net. The camera is either
    BEHIND A BACK BOUNDARY LINE, looking down the length of the court, or BESIDE THE
    COURT IN THE PLANE OF THE NET, looking across it.
      - Behind a baseline: the NEAR baseline is the back boundary line closest to the
        camera (LOWER and wider in the picture) and the FAR baseline is the other one,
        beyond the net.
      - Beside the court in the net plane: the net projects to a single near-vertical
        line, the court's long axis runs left-right across the picture, and both back
        boundary lines sit at or outside the frame edges - so `corner_*` are usually
        not visible and should be left out rather than guessed at (D-19). NEAR is then
        the sideline nearest the camera, LOWER in the picture.
    The four corners wanted here are the OUTER (doubles) corners; a doubles-marked
    court has an extra sideline about 0.5 m inside each outer one, and the outer pair
    is the one to click.
    Which sideline is "l" and which is "r": `l` is further LEFT in the picture, `r`
    further RIGHT. A whole-court left/right swap is corrected by the software as long
    as you are consistent.
    "NEAR = closer to the camera = lower in the picture" is also the rule
    `templatefit.near_end_is_left` applies mechanically (a template with a `net_y` is a
    net sport, filmed from behind a baseline), so keep the two in step if either moves.
  landmark_descriptions:
    corner_nl: the court corner where the NEAR back boundary line meets the `l` sideline.
    corner_nr: the court corner where the NEAR back boundary line meets the `r` sideline.
    corner_fl: the court corner where the FAR back boundary line meets the `l` sideline.
    corner_fr: the court corner where the FAR back boundary line meets the `r` sideline.
    net_post_l: >-
      the point on the floor where the net crosses the `l` sideline, halfway along the
      court - the base of the left net post on a doubles court.
    net_post_r: the same crossing on the `r` sideline.
    short_nl: >-
      where the short service line on the NEAR side (the line about 2 m in front of
      the net, on the camera side) meets the `l` sideline.
    short_nr: the same NEAR short-service-line end on the `r` sideline.
    short_fl: where the FAR short service line meets the `l` sideline.
    short_fr: where the FAR short service line meets the `r` sideline.
    long_nl: >-
      where the doubles long service line (the line about 0.75 m inside the NEAR back
      boundary line) meets the `l` sideline. Doubles courts only.
    long_nr: the same NEAR doubles long-service-line end on the `r` sideline.
    long_fl: where the FAR doubles long service line meets the `l` sideline.
    long_fr: the same FAR end on the `r` sideline.
    centre_n: where the centre line of the NEAR half meets the NEAR back boundary line.
    centre_sn: where that same centre line meets the NEAR short service line.
    centre_sf: where the FAR half's centre line meets the FAR short service line.
    centre_f: where the FAR half's centre line meets the FAR back boundary line.
    singles_nl: >-
      where the NEAR short service line meets the INNER (singles) sideline on the `l`
      side - about 0.5 m inside `short_nl`. Doubles-marked courts only.
    singles_nr: the same NEAR short-service-line crossing of the `r` singles sideline.
    singles_fl: where the FAR short service line meets the `l` singles sideline.
    singles_fr: where the FAR short service line meets the `r` singles sideline.
  # Measured on `badminton_auditorium_240s.mp4` (samples/real/RESULTS.md): sweeping this
  # 0.5 -> 3.0 m changes nothing — 29 on-court tracklets at every value, worst
  # `inside_fraction` 0.74 even at 0.5 m — because the hall is empty apart from the four
  # players. So the clip cannot pick the value; these two facts do. The players' own
  # excursion past the paint is p99 0.79 m / max 3.15 m, so 1.0 m covers the normal case;
  # and 1.0 is what pickleball *measured*, for the reason that applies here too (halls lay
  # courts side by side, and 2.5 m reached the next one).
  margin_m: 1.0
players: {min: 2, max: 4}
team_rule: net_side
teams:
  colors: ["#2E5EAA", "#C8452B"]
detection: {classes: [person], stride: 2, model: yolo11n.pt, imgsz: 960, conf: 0.25}
tracking:
  oncourt_min_fraction: 0.6
  min_lifetime_s: 1.0
  merge_max_gap_s: 3.0
  merge_max_dist_m: 3.0
  smooth_window: 5
events: [rally]
rally: {min_duration_s: 2.0, max_gap_s: 1.5, expected_contact_hz: [0.8, 3.0]}
# Measured on `badminton_auditorium_240s.mp4`: that camera stands in the plane of the net,
# so the scale across the court is nearly uniform (person boxes 117-483 px tall, p95 324)
# instead of pickleball's 7x run from baseline to baseline. The court fills the frame
# (`court_px_width` 1920), so zoom 2.0 gives a 960 x 540 window: the p95 player is 60 % of
# its height and the tallest 89 %. 1.5 (the copied pickleball-era value) left the subject
# at 40 % with half the window empty court — read at t = 40 s and t = 150 s.
followcam: {zoom: 2.0, lead_s: 0.3, stiffness: 7.0}
query_vocab:
  rallies: {type: rally}
  "longest rallies": {type: rally, sort: duration_desc, limit: 10}
sport_ui:
  chips: ["Rallies", "Longest rallies", "Bookmarks"]
  review: [heatmap]
# Synthetic clip choreography (courtcam.synth); nothing in the pipeline reads it.
synth:
  view: baseline
  floor: "#2E7D4F"
  apron: "#5A5A60"
  ball: {radius_m: 0.03, color: "#F5F5F5"}
  serve_height_m: 1.0
  contact_height_m: [1.0, 2.6]
  touches_per_side: [1, 1]
  flight_s: [0.7, 1.2]
  shots_per_rally: [3, 9]
  contact_sound_hz: 2200
